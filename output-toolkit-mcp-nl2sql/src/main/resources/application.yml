# ==========================================
# MySQL MCP Server 配置文件
# ==========================================

# MySQL 数据库连接配置
mysql:
  host: localhost
  port: 3306
  user: root
  password: root
  database: seata_db            # 为空则使用多库模式
  charset: utf8mb4
  connect-timeout: 10
  # SSL 配置
  ssl:
    mode: DISABLED           # DISABLED / REQUIRED / VERIFY_CA / VERIFY_IDENTITY
  # SSH 隧道配置
  ssh:
    enabled: false
    port: 22
    connect-timeout: 10

# Spring + MCP 配置
spring:
  application:
    name: mcp-nl2sql
  main:
    banner-mode: off         # 关闭 Spring Boot banner（避免污染 stdout）
  ai:
    mcp:
      server:
        name: mcp-nl2sql       # MCP 服务器名称
        protocol: SSE                # 协议类型：SSE / STREAMABLE / STATELESS
        stdio: true                  # 关键：启用 STDIO 传输模式（默认 false，不启用则 Claude Code 无法连接）
        enabled: true                # 启用 MCP 服务器
        capabilities:
          tool: true                 # 工具能力（execute_sql / get_schema_info / get_table_sample）
          resource: true             # 资源能力（list / read table resources）
          prompt: true               # 提示能力
        # 功能开关
        resource-change-notification:
          enabled: true
        prompt-change-notification:
          enabled: true

# 日志配置
logging:
  level:
    root: WARN
    com.zhouchuanxiang.outputtoolkit: INFO
