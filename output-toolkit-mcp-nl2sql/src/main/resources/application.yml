# ==========================================
# MySQL MCP Server 配置文件
# ==========================================
#
# 两种运行模式（二选一）：
#   STDIO 模式 → Claude Desktop 本地使用（推荐）
#   SSE  模式 → 远程访问 / Web 客户端
#
# 切换方式：修改 spring.ai.mcp.server 下的配置

# MySQL 数据库连接配置（通过环境变量覆盖，默认值仅作为 fallback）
mysql:
  host: ${MYSQL_HOST:localhost}
  port: ${MYSQL_PORT:3306}
  user: ${MYSQL_USER:root}
  password: ${MYSQL_PASSWORD:root}
  database: ${MYSQL_DATABASE:}   # 为空则多库模式
  charset: ${MYSQL_CHARSET:utf8mb4}
  connect-timeout: ${MYSQL_CONNECT_TIMEOUT:10}
  # 增删改操作开关（均可通过环境变量覆盖）
  insert-enabled: ${MYSQL_INSERT_ENABLED:true}   # 是否允许 INSERT
  update-enabled: ${MYSQL_UPDATE_ENABLED:true}   # 是否允许 UPDATE
  delete-enabled: ${MYSQL_DELETE_ENABLED:true}   # 是否允许 DELETE
  ssl:
    mode: DISABLED               # DISABLED / REQUIRED / VERIFY_CA / VERIFY_IDENTITY
  ssh:
    enabled: false
    port: 22
    connect-timeout: 10

# ==========================================
# STDIO 模式（Claude Desktop 本地使用）
# ==========================================
spring:
  application:
    name: mcp-nl2sql
  main:
    banner-mode: off             # 关闭 banner，避免污染 stdout
  ai:
    mcp:
      server:
        name: mcp-nl2sql         # MCP 服务器名称
        stdio: true              # 启用 STDIO 模式
        enabled: true
        capabilities:
          tool: true
          resource: true
          prompt: true

