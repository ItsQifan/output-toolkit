# ==========================================
# MySQL MCP Server 配置文件
# ==========================================
#
# 两种运行模式（二选一）：
#   STDIO 模式 → Claude Desktop 本地使用（推荐）
#   SSE  模式 → 远程访问 / Web 客户端
#
# 切换方式：修改 spring.ai.mcp.server 下的配置

# MySQL 数据库连接配置
mysql:
  host: localhost
  port: 3306
  user: root
  password: root
  database: seata_db            # 为空则使用多库模式
  charset: utf8mb4
  connect-timeout: 10
  ssl:
    mode: DISABLED               # DISABLED / REQUIRED / VERIFY_CA / VERIFY_IDENTITY
  ssh:
    enabled: false
    port: 22
    connect-timeout: 10

# ==========================================
# STDIO 模式（Claude Desktop 本地使用）
# ==========================================
#spring:
#  application:
#    name: mcp-nl2sql
#  main:
#    banner-mode: off             # 关闭 banner，避免污染 stdout
#  ai:
#    mcp:
#      server:
#        name: mcp-nl2sql         # MCP 服务器名称
#        stdio: true              # 启用 STDIO 模式
#        enabled: true
#        capabilities:
#          tool: true
#          resource: true
#          prompt: true

# ==========================================
# SSH 模式（远程访问，取消注释并注释掉 STDIO 块）
# ==========================================
spring:
   ai:
     mcp:
       server:
         name: mcp-nl2sql
         protocol: SSE           # 使用 SSE 协议
         stdio: false            # 关闭 STDIO
         enabled: true
         capabilities:
           tool: true
           resource: true
           prompt: true
server:
   port: 8000                   # SSE 服务端口

mcp:
   sse-allowed-hosts: localhost,127.0.0.1  # DNS 重绑定白名单

# 日志配置
logging:
  level:
    root: WARN
    com.zhouchuanxiang.outputtoolkit: INFO
